# True color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Prefix: Ctrl+a (avoids conflicts with Claude Code's Ctrl+b usage)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Sensible base index
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Large scrollback for Claude's verbose output
set -g history-limit 50000

# Focus events (needed by Neovim/other apps for autoread, etc.)
set -g focus-events on

# Mouse support (scroll, click pane/window)
set -g mouse on

# Vi mode for copy
setw -g mode-keys vi

# Splits that open in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation (h/j/k/l without prefix for quick movement)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Faster escape (important: Claude Code uses ESC for menu navigation)
set -sg escape-time 10

# Status bar
set -g status-position bottom
set -g status-style 'fg=colour244'
set -g status-left '[#S] '
set -g status-right '%H:%M'
set -g window-status-current-style 'fg=colour255 bold'

# Claude Code: restart current session (Ctrl+a R)
bind r send-keys '/exit' Enter \; run-shell 'sleep 2 && tmux send-keys -t #{pane_id} "claude --continue" Enter'
